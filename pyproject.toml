[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-measure-usage"
version = "0.1.1"
description = "Interactive TUI for debugging token usage of Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Korobov" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "tokens", "usage", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/zytedata/claude-measure-usage"
Issues = "https://github.com/zytedata/claude-measure-usage/issues"

[project.scripts]
claude-measure-usage = "claude_measure_usage.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.ruff.lint]
# Pyflakes plus the error-level pycodestyle checks. The wider default set
# flags patterns (blind excepts, mutable class defaults, try-except-pass)
# that each need a per-site decision, so opt into those deliberately.
select = ["E4", "E7", "E9", "F"]

[tool.bumpversion]
current_version = "0.1.1"
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[[tool.bumpversion.files]]
filename = "plugins/measure-usage/.claude-plugin/plugin.json"

# Anchored so it does not also match `current_version` above.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"$'
replace = 'version = "{new_version}"'

# The package source lives under the Claude Code plugin tree so the
# same files can be loaded by the /measure-usage skill. Point hatch
# at that path so the built wheel still contains a top-level
# `claude_measure_usage/` package.
[tool.hatch.build.targets.wheel]
packages = ["plugins/measure-usage/skills/measure-usage/claude_measure_usage"]

[tool.hatch.build.targets.sdist]
include = [
    "plugins/measure-usage/skills/measure-usage/claude_measure_usage/**",
    "CHANGELOG.md",
    "README.md",
    "pyproject.toml",
    "tests/**",
]
